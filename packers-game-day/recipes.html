<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Packers Game Day Recipe Book</title><style>body{margin:0;background:#f8f1df;color:#173d2b;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}.load{text-align:center;padding:24px}.ball{font-size:42px}.small{color:#6f685c;margin-top:8px}</style></head><body><div class="load"><div class="ball">🍽️</div><div>Loading the Game Day Recipe Book…</div><div class="small">Just a second.</div></div><script>
(async()=>{try{const names=['recipes-0.b64','recipes-1.b64','recipes-2.b64','recipes-3.b64','recipes-4.b64','recipes-5.b64','recipes-6.b64','recipes-7.b64'];const texts=await Promise.all(names.map(n=>fetch(n).then(r=>{if(!r.ok)throw new Error(n);return r.text()})));const b64=texts.join('').replace(/\s+/g,'');const raw=atob(b64);const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);if(!('DecompressionStream'in window))throw new Error('Please update your browser to open the recipe book.');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="load"><div class="ball">🍽️</div><h2>Could not open the recipe book</h2><div class="small">'+e.message+'</div></div>'}})();
</script></body></html>
